<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoloQuest</title>
<style>
:root{--bg:#0b0e10;--panel:#151a1d;--line:#31393e;--txt:#ece6d8;--mut:#9ca5a9;--gold:#c7a45c;--blue:#87aec9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1c2529,#0b0e10 42%);color:var(--txt);font-family:Georgia,serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#232a2e;color:var(--txt);border-radius:8px;padding:8px 11px}button:hover{border-color:#6b757b}.primary{background:linear-gradient(#d2b36b,#aa873f);color:#161109;font-weight:800}.hidden{display:none!important}.ey{font:800 10px system-ui;letter-spacing:.17em;color:var(--gold)}h1,h2,p{margin:0}header{min-height:72px;display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line);background:#0b0e10ed;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}header nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.badge{font:700 10px system-ui;color:#d8c284;border:1px solid #6e5d38;padding:7px 9px;border-radius:99px}main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;max-width:1500px;margin:auto;padding:14px}.panel{background:#151a1ded;border:1px solid var(--line);border-radius:13px;box-shadow:0 18px 50px #0005}.scene{overflow:hidden}.scenehead{display:flex;justify-content:space-between;padding:15px 17px}.sceneart{height:230px;background:linear-gradient(135deg,#283135,#0f1315);display:grid;place-items:center;overflow:hidden}.sceneart img{width:100%;height:100%;object-fit:cover}.placeholder{text-align:center;color:var(--mut)}.placeholder div{font-size:42px;color:var(--gold)}.chips{padding:9px 12px;display:flex;gap:6px;flex-wrap:wrap}.chips span{font:11px system-ui;color:var(--mut);padding:6px 9px;border:1px solid var(--line);border-radius:99px}.tabs{display:flex;gap:6px;margin:11px 0}.tab.active{border-color:#8a7445;color:#e0c77d;background:#242115}.log{padding:18px;min-height:340px;max-height:50vh;overflow:auto}.entry{border-bottom:1px solid #293136;padding-bottom:14px;margin-bottom:14px}.entry:last-child{border:0}.role{font:800 10px system-ui;letter-spacing:.15em;color:var(--gold);margin-bottom:7px}.player .role{color:var(--blue)}.text{white-space:pre-wrap;line-height:1.55}.rollprompt{margin-top:9px;padding:12px 14px;border:1px solid #725f37;background:#251f13;border-radius:10px;display:flex;justify-content:space-between;align-items:center}.rollprompt span{display:block;font:11px system-ui;color:var(--mut);margin-top:3px}.composer{padding:12px;margin-top:9px}.composer textarea{width:100%;min-height:86px;background:#0e1214;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}.composebar{display:flex;justify-content:space-between;gap:8px;margin-top:8px}.quick{display:flex;gap:5px}.quick button{font-size:11px;padding:6px 8px}.content{padding:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sheet{padding:15px;position:sticky;top:86px;height:calc(100vh - 100px);overflow:auto}.sheethead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:11px}.sheethead p{font:12px system-ui;color:var(--mut);margin-top:3px}.vitals{display:grid;grid-template-columns:70px 1fr 70px;gap:7px;margin:12px 0}.vital,.hp{border:1px solid var(--line);background:#101416;border-radius:10px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center}.vital span,.hp span{font:9px system-ui;color:var(--mut);letter-spacing:.12em}.vital b{font-size:22px}.hp div{display:flex;gap:8px;align-items:center;margin-top:5px}.hp button{padding:2px 7px}.abilities{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.ability{background:#101416;border:1px solid var(--line);border-radius:7px;text-align:center;padding:6px 2px}.ability span{font:800 9px system-ui;color:var(--mut)}.ability b{display:block;font-size:17px}.ability em{font:11px system-ui;color:var(--gold);font-style:normal}.block{margin-top:14px}.blocktitle{border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:6px;font:800 10px system-ui;color:var(--mut);letter-spacing:.11em;text-transform:uppercase}.skill,.weapon,.item,.quest,.companion{display:flex;justify-content:space-between;align-items:center;background:#101416;border:1px solid #2b3337;border-radius:7px;padding:7px;margin-bottom:5px;font:12px system-ui}.skill button{padding:3px 6px;font-size:10px}.weapon small,.item small,.quest small,.companion small{display:block;color:var(--mut);margin-top:2px}.dice{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.dice button{font-size:11px;padding:8px 0}.overlay{position:fixed;inset:0;background:#050708db;display:grid;place-items:center;z-index:30}.die{width:150px;height:150px;display:grid;place-items:center;background:radial-gradient(circle,#dec57e,#987535);color:#171107;clip-path:polygon(50% 0,94% 25%,83% 81%,50% 100%,17% 81%,6% 25%);font:800 54px system-ui;margin:auto}.overlay{text-align:center}.overlay p{font:800 18px system-ui;margin-top:14px}.hint{font:12px system-ui;color:var(--mut)}@media(max-width:960px){main{grid-template-columns:1fr}.sheet{position:relative;top:0;height:auto}.log{max-height:none}}@media(max-width:640px){main{padding:7px}.two{grid-template-columns:1fr}.abilities{grid-template-columns:repeat(3,1fr)}.quick{display:none}}
</style>
</head>
<body>
<header><div><div class="ey">SOLO FANTASY ADVENTURE</div><h1>SoloQuest <small style="font:12px system-ui;color:#9ca5a9">v0.3 Alpha</small></h1></div><nav><span id="mode" class="badge">READY</span><button id="saveBtn">Save</button><button id="resetBtn">Reset</button></nav></header>
<main>
<section>
<article class="scene panel"><div class="scenehead"><div><div class="ey">CURRENT SCENE</div><h2 id="sceneTitle"></h2></div><button id="artBtn">Generate Scene Art</button></div><div id="sceneArt" class="sceneart"><div class="placeholder"><div>✦</div><b>Theater of the mind</b><br><span>Generate art for important scenes.</span></div></div><div class="chips"><span id="locChip"></span><span id="timeChip"></span><span id="weatherChip"></span></div></article>
<div class="tabs"><button class="tab active" data-tab="story">Story</button><button class="tab" data-tab="journal">Journal</button><button class="tab" data-tab="companions">Companions</button></div>
<section id="storyPane"><div id="log" class="log panel"></div><div id="rollPrompt" class="rollprompt hidden"><div><div class="ey">ROLL REQUIRED</div><b id="rollLabel"></b><span id="rollReason"></span></div><button id="rollNow" class="primary">Roll</button></div><form id="actionForm" class="composer panel"><textarea id="action" placeholder="Describe what Richter does or says…"></textarea><div class="composebar"><div class="quick"><button type="button" data-q="I carefully study the area and everyone present for anything unusual.">Observe</button><button type="button" data-q="I move quietly and use the available cover to stay unnoticed.">Sneak</button><button type="button" data-q="I speak calmly and try to understand what is motivating them.">Talk</button></div><button id="sendBtn" class="primary">Take Action</button></div></form></section>
<section id="journalPane" class="hidden"><div class="two"><div class="panel content"><div class="sectionhead"><h2>Quests</h2><button id="addQuest">+ Quest</button></div><div id="quests"></div></div><div class="panel content"><div class="sectionhead"><h2>Inventory</h2><button id="addItem">+ Item</button></div><div id="inventory"></div></div></div></section>
<section id="companionsPane" class="hidden"><div class="panel content"><div class="sectionhead"><h2>Companions</h2><button id="addCompanion">+ Companion</button></div><div id="companions"></div></div></section>
</section>
<aside class="sheet panel"><div class="sheethead"><div><div class="ey">CHARACTER</div><h2 id="name"></h2><p id="charline"></p></div></div><div class="vitals"><div class="vital"><span>AC</span><b id="ac"></b></div><div class="hp"><span>HP</span><div><button id="minusHp">−</button><b id="hp"></b><button id="plusHp">+</button></div></div><div class="vital"><span>INIT</span><b id="init"></b></div></div><div id="abilities" class="abilities"></div><section class="block"><div class="blocktitle">Skills</div><div id="skills"></div></section><section class="block"><div class="blocktitle">Weapons</div><div id="weapons"></div></section><section class="block"><div class="blocktitle">Dice</div><div class="dice"><button data-die="4">d4</button><button data-die="6">d6</button><button data-die="8">d8</button><button data-die="10">d10</button><button data-die="12">d12</button><button data-die="20">d20</button></div></section></aside>
</main>
<div id="diceOverlay" class="overlay hidden"><div><div id="die" class="die">20</div><p id="diceResult">Rolling…</p></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], KEY='soloquest-live-v03';
const base={character:{name:'Richter Belmont',species:'Human',className:'Fighter',level:1,abilities:{str:17,dex:16,con:14,int:12,wis:13,cha:11},hp:12,maxHp:12,ac:16,initiative:3,skills:{athletics:5,insight:3,perception:3,stealth:5,survival:3},weapons:[{name:'Longsword',bonus:5,damage:'1d8+3',note:'Versatile 1d10+3'},{name:'Parrying Dagger',bonus:5,damage:'1d4+3',note:'Dagger mechanically'},{name:'Light Crossbow',bonus:5,damage:'1d8+3',note:'Range 80/320'}]},campaign:{title:'The Mark Below',location:'Priory of Saint Merrow',time:'Morning',weather:'Cold mist after heavy rain',imagePrompt:''},inventory:[{id:'rations',name:'Rations',qty:3,note:'Travel food'},{id:'bolts',name:'Crossbow Bolts',qty:18,note:'Ammunition'}],quests:[{id:'find_dhal',title:'Find Corvin Dhal',detail:'Determine who Corvin Dhal is, where he went, and why he matters.',status:'active'},{id:'mark',title:'The Four-Line Mark',detail:'Learn the meaning of three vertical lines crossed by a fourth.',status:'active'}],companions:[{id:'voss',name:'Aldren Voss',role:'Lieutenant / veteran soldier',hp:7,maxHp:10,status:'Injured'}],pendingRoll:null,sceneImage:null,log:[{role:'dm',text:'Morning settles over the Priory of Saint Merrow. Rainwater still runs from the stone eaves.\n\nMother Elira, Lieutenant Voss, Garran Vale, and Richter Belmont sit around the long refectory table. Garran’s weapons remain secured elsewhere. Beneath the priory are older chambers bearing the same four-line mark Richter was sent to investigate.\n\nElira folds her hands. “Corvin Dhal is missing. A dead man appears to be hiring mercenaries. And whatever Dhal found beneath this priory frightened him badly enough to disappear.”\n\nShe looks to Richter.\n\n“Where do you want to begin?”'}]};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(base);
const mod=v=>Math.floor((+v-10)/2), sg=v=>(+v>=0?`+${v}`:`${v}`), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){const c=state.character;$('#name').textContent=c.name;$('#charline').textContent=`${c.species} ${c.className} • Level ${c.level}`;$('#ac').textContent=c.ac;$('#hp').textContent=`${c.hp}/${c.maxHp}`;$('#init').textContent=sg(c.initiative);$('#abilities').innerHTML=Object.entries(c.abilities).map(([k,v])=>`<div class="ability"><span>${k.toUpperCase()}</span><b>${v}</b><em>${sg(mod(v))}</em></div>`).join('');$('#skills').innerHTML=Object.entries(c.skills).map(([k,v])=>`<div class="skill"><span>${k[0].toUpperCase()+k.slice(1)}</span><button data-skill="${k}" data-mod="${v}">${sg(v)}</button></div>`).join('');$('#weapons').innerHTML=c.weapons.map(w=>`<div class="weapon"><div><b>${esc(w.name)}</b><small>${esc(w.damage)} • ${esc(w.note)}</small></div><b>${sg(w.bonus)}</b></div>`).join('');$('#sceneTitle').textContent=state.campaign.title;$('#locChip').textContent=state.campaign.location;$('#timeChip').textContent=state.campaign.time;$('#weatherChip').textContent=state.campaign.weather;if(state.sceneImage)$('#sceneArt').innerHTML=`<img src="${state.sceneImage}" alt="Generated scene">`;$('#log').innerHTML=state.log.map(e=>`<div class="entry ${e.role==='player'?'player':''}"><div class="role">${e.role==='player'?'PLAYER':'GAME MASTER'}</div><div class="text">${esc(e.text)}</div></div>`).join('');$('#log').scrollTop=$('#log').scrollHeight;if(state.pendingRoll){$('#rollPrompt').classList.remove('hidden');$('#rollLabel').textContent=`${state.pendingRoll.label}: ${state.pendingRoll.dice} ${sg(state.pendingRoll.modifier)}`;$('#rollReason').textContent=state.pendingRoll.reason||''}else $('#rollPrompt').classList.add('hidden');$('#inventory').innerHTML=state.inventory.map(i=>`<div class="item"><div><b>${esc(i.name)} ×${i.qty}</b><small>${esc(i.note||'')}</small></div></div>`).join('')||'<p class="hint">No items.</p>';$('#quests').innerHTML=state.quests.map(q=>`<div class="quest"><div><b>${esc(q.title)}</b><small>${esc(q.detail)} • ${q.status}</small></div></div>`).join('');$('#companions').innerHTML=state.companions.map(x=>`<div class="companion"><div><b>${esc(x.name)}</b><small>${esc(x.role)} • HP ${x.hp}/${x.maxHp} • ${esc(x.status||'')}</small></div></div>`).join('');save()}
function events(list=[]){for(const e of list){if(e.type==='damage'&&e.target==='player')state.character.hp=Math.max(0,state.character.hp-(+e.amount||0));if(e.type==='heal'&&e.target==='player')state.character.hp=Math.min(state.character.maxHp,state.character.hp+(+e.amount||0));if(e.type==='add_item'){let i=state.inventory.find(x=>x.name.toLowerCase()===String(e.name).toLowerCase());i?i.qty+=(+e.qty||1):state.inventory.push({id:crypto.randomUUID(),name:e.name,qty:+e.qty||1,note:e.note||''})}if(e.type==='remove_item'){let i=state.inventory.find(x=>x.name.toLowerCase()===String(e.name).toLowerCase());if(i){i.qty=Math.max(0,i.qty-(+e.qty||1));if(!i.qty)state.inventory=state.inventory.filter(x=>x!==i)}}if(e.type==='quest_add'&&!state.quests.some(q=>q.id===e.id))state.quests.push({id:e.id||crypto.randomUUID(),title:e.title||'New Quest',detail:e.detail||'',status:'active'});if(e.type==='quest_update'){let q=state.quests.find(x=>x.id===e.id);if(q)q.status=e.status||q.status}if(e.type==='companion_hp'){let x=state.companions.find(c=>c.id===e.id);if(x)x.hp=Math.max(0,Math.min(x.maxHp,x.hp+(+e.delta||0)))}}}
async function act(action){action=String(action||'').trim();if(!action)return;state.log.push({role:'player',text:action});state.pendingRoll=null;render();$('#action').value='';$('#sendBtn').disabled=true;$('#sendBtn').textContent='Thinking…';try{const r=await fetch('/api/dm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,character:state.character,campaign:state.campaign,inventory:state.inventory,quests:state.quests,companions:state.companions,recentLog:state.log.slice(-14)})});const d=await r.json();state.log.push({role:'dm',text:d.narrative||d.error||'The Game Master falls silent.'});state.pendingRoll=d.roll||null;events(d.events||[]);if(d.scene){for(const k of ['title','location','time','weather'])if(d.scene[k])state.campaign[k]=d.scene[k];if(d.scene.image_prompt)state.campaign.imagePrompt=d.scene.image_prompt}$('#mode').textContent=d.mode==='openai'?'LIVE AI':'MOCK/FALLBACK'}catch(e){state.log.push({role:'dm',text:`Connection error: ${e.message}`})}finally{$('#sendBtn').disabled=false;$('#sendBtn').textContent='Take Action';render()}}
function roll(sides,modifier=0,label=`d${sides}`,cb){const n=1+Math.floor(Math.random()*sides),t=n+(+modifier||0);$('#diceOverlay').classList.remove('hidden');$('#die').textContent=n;$('#diceResult').textContent=`${label}: ${n}${modifier?sg(modifier):''} = ${t}`;setTimeout(()=>{$('#diceOverlay').classList.add('hidden');cb?.(n,t)},900)}
$('#actionForm').onsubmit=e=>{e.preventDefault();act($('#action').value)};$$('[data-q]').forEach(b=>b.onclick=()=>{$('#action').value=b.dataset.q;$('#action').focus()});$('#rollNow').onclick=()=>{const p=state.pendingRoll;if(!p)return;const m=/d(\d+)/i.exec(p.dice||'1d20');roll(+(m?.[1]||20),p.modifier,p.label,(n,t)=>{state.pendingRoll=null;state.log.push({role:'player',text:`[Roll] ${p.label}: ${n}${sg(p.modifier)} = ${t}`});render();setTimeout(()=>act(`Resolve the requested ${p.label} roll. Result: ${t} (natural ${n}, modifier ${sg(p.modifier)}).`),150)})};$$('[data-die]').forEach(b=>b.onclick=()=>roll(+b.dataset.die));$('#skills').onclick=e=>{const b=e.target.closest('[data-skill]');if(b)roll(20,+b.dataset.mod,b.dataset.skill)};$('#minusHp').onclick=()=>{state.character.hp=Math.max(0,state.character.hp-1);render()};$('#plusHp').onclick=()=>{state.character.hp=Math.min(state.character.maxHp,state.character.hp+1);render()};$('.tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));['story','journal','companions'].forEach(k=>$('#'+k+'Pane').classList.toggle('hidden',k!==b.dataset.tab))};$('#saveBtn').onclick=()=>{save();alert('Saved in this browser.')};$('#resetBtn').onclick=()=>{if(confirm('Reset this campaign?')){localStorage.removeItem(KEY);location.reload()}};$('#addItem').onclick=()=>{const n=prompt('Item name?');if(n){state.inventory.push({id:crypto.randomUUID(),name:n,qty:1,note:''});render()}};$('#addQuest').onclick=()=>{const n=prompt('Quest title?');if(n){state.quests.push({id:crypto.randomUUID(),title:n,detail:'',status:'active'});render()}};$('#addCompanion').onclick=()=>{const n=prompt('Companion name?');if(n){state.companions.push({id:crypto.randomUUID(),name:n,role:'Companion',hp:10,maxHp:10,status:'Healthy'});render()}};$('#artBtn').onclick=async()=>{const b=$('#artBtn');b.disabled=true;b.textContent='Painting…';try{const last=[...state.log].reverse().find(x=>x.role==='dm')?.text||'';const description=state.campaign.imagePrompt||`${state.campaign.location}, ${state.campaign.weather}. ${last.slice(0,1000)}`;const r=await fetch('/api/scene-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Image failed');state.sceneImage=d.image;render()}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='Generate Scene Art'}};$('#diceOverlay').onclick=()=>$('#diceOverlay').classList.add('hidden');render();
</script>
</body>
</html>
